name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Catches syntax errors in browser modules, which no test imports directly
      - name: Check module syntax
        run: for file in src/*.js; do node --check "$file"; done
